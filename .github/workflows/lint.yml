# whenever someone changes the python code 
# linter will check if the syntax,code,format,indentation is correct or not
name: Auto Linter

on: 
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    #this step will automatically clone the code of the current branch into the runner
    steps:
      - name:  Checkout/clone the code
        uses: actions/checkout@v7
      - name: Install Linter
        run: pip install ruff

      - name: check files for liniting
        run: ruff check .
        
